name: CI

on:
  push:
  pull_request:

# The job only reads the repository; nothing here needs to write with GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  # Every push to master gets its own run, so each landing gets a verdict;
  # other branches still cancel a run a newer push superseded.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint, build and test
        run: scripts/ci.sh
